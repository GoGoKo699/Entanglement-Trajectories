[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "entanglement-trajectories"
version = "1.0.0"
description = "Corrected Schmidt-spectrum trajectories, exact metric envelopes, and quantitative metric-robust morphology"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
license = {text = "BSD-3-Clause"}
readme = "README.md"
authors = [{name = "Ruge Lin"}]

[project.optional-dependencies]
analysis = ["pandas>=2", "matplotlib>=3.7", "scipy>=1.10", "Pillow>=10"]
test = ["pytest>=8", "pandas>=2", "matplotlib>=3.7", "scipy>=1.10", "PyYAML>=6", "Pillow>=10"]
qa = ["pytest>=8", "pandas>=2", "matplotlib>=3.7", "scipy>=1.10", "PyYAML>=6", "Pillow>=10", "PyMuPDF>=1.24"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.setuptools.package-data]
"entanglement_trajectories.data" = ["*.json"]

[project.urls]
Homepage = "https://github.com/GoGoKo699/Entanglement-Trajectories"
Publication = "https://doi.org/10.22331/q-2024-03-14-1282"
Issues = "https://github.com/GoGoKo699/Entanglement-Trajectories/issues"
