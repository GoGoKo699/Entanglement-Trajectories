name: repository-qa

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[analysis,test]'
      - name: Rebuild machine context and public figures
        run: make public-context public-figures
      - name: Run scientific tests
        run: make test
      - name: Validate compact public repository
        run: make public-validate
